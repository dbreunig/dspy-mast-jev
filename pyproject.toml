[project]
name = "mast-dspy-jev"
version = "0.1.0"
description = "A DSPy judge that labels multi-agent traces with MAST failure modes using TypeSafe's Jev"
requires-python = ">=3.12"
dependencies = [
    "dspy[typesafe]==3.4.0",
    "huggingface-hub",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mast_judge"]
